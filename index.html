
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comanda Entrar</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link href="css/comanda.css" rel="stylesheet" />
</head>

<body class="cmd-body" data-pagina="login">

    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">

            <!-- PAINEL DA IMAGEM -->
            <aside class="col-12 col-lg-6 d-flex cmd-painel-marca flex-column justify-content-between p-4 p-lg-5">
                <img
                    src="fotos/foto1.webp"
                    alt="Restaurante Sabor da Terra"
                    class="cmd-imagem-fundo"
                />
            </aside>

            <!-- PAINEL DE LOGIN -->
            <main class="col-12 col-lg-6 d-flex flex-column align-items-center justify-content-center p-4">

                <div class="w-100 mb-3" style="max-width: 460px;">
                    <a href="pag1.html" class="cmd-voltar-site">
                        <span aria-hidden="true">←</span> Voltar para o site
                    </a>
                </div>

                <div class="cmd-caixa-login w-100">

                    <div class="mb-4">
                        <span class="cmd-badge-sistema">COMANDA DIGITAL</span>
                        <h2 class="cmd-titulo-login mt-2 mb-1">Acesse o sistema</h2>
                        <p class="cmd-subtitulo-login mb-0">Entre com suas credenciais para continuar.</p>
                    </div>

                    <ul class="nav nav-tabs mb-4" role="tablist">

                        <li class="nav-item" role="presentation">
                            <button
                                class="nav-link active"
                                id="tab-entrar"
                                data-bs-toggle="tab"
                                data-bs-target="#painel-entrar"
                                type="button"
                                role="tab"
                                aria-controls="painel-entrar"
                                aria-selected="true"
                            >
                                Entrar
                            </button>
                        </li>

                        <li class="nav-item" role="presentation">
                            <button
                                class="nav-link"
                                id="tab-cadastro"
                                data-bs-toggle="tab"
                                data-bs-target="#painel-cadastro"
                                type="button"
                                role="tab"
                                aria-controls="painel-cadastro"
                                aria-selected="false"
                            >
                                Criar conta de Cliente
                            </button>
                        </li>

                    </ul>

                    <div class="tab-content">

                        <!-- LOGIN -->
                        <section
                            class="tab-pane fade show active"
                            id="painel-entrar"
                            role="tabpanel"
                            aria-labelledby="tab-entrar"
                        >

                            <form id="form-login" novalidate>

                                <div class="mb-3">
                                    <label for="login-email" class="form-label">
                                        E-mail
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control form-control-lg"
                                        id="login-email"
                                        placeholder="Digite seu e-mail"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="login-senha" class="form-label">
                                        Senha
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control form-control-lg"
                                        id="login-senha"
                                        placeholder="********"
                                        required
                                    />
                                </div>

                                <div
                                    id="login-erro"
                                    class="alert alert-danger d-none"
                                    role="alert"
                                ></div>

                                <button
                                    type="submit"
                                    class="btn btn-lg w-100 cmd-btn-principal"
                                    id="btn-entrar"
                                >
                                    Entrar
                                </button>

                                <p class="cmd-texto-apoio mt-3 mb-0">
                                    Depois do login, cada perfil é levado para a sua tela.
                                    Contas de atendente e de administrador são criadas pelo administrador.
                                </p>

                            </form>
                        </section>

                        <!-- CADASTRO -->
                        <section
                            class="tab-pane fade"
                            id="painel-cadastro"
                            role="tabpanel"
                            aria-labelledby="tab-cadastro"
                        >

                            <form id="form-cadastro" novalidate>

                                <div class="mb-3">
                                    <label for="cad-nome" class="form-label">
                                        Nome
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control form-control-lg"
                                        id="cad-nome"
                                        placeholder="Seu nome"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="cad-email" class="form-label">
                                        E-mail
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control form-control-lg"
                                        id="cad-email"
                                        placeholder="Digite seu e-mail"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="cad-senha" class="form-label">
                                        Senha
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control form-control-lg"
                                        id="cad-senha"
                                        placeholder="Mínimo 6 caracteres"
                                        minlength="6"
                                        required
                                    />
                                </div>

                                <div
                                    id="cad-erro"
                                    class="alert alert-danger d-none"
                                    role="alert"
                                ></div>

                                <div
                                    id="cad-sucesso"
                                    class="alert alert-success d-none"
                                    role="status"
                                ></div>

                                <button
                                    type="submit"
                                    class="btn btn-lg w-100 cmd-btn-principal"
                                    id="btn-cadastrar"
                                >
                                    Criar conta
                                </button>

                            </form>
                        </section>

                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
