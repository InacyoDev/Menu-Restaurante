<!doctype html>
<html lang="pt-BR">
  <head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comanda Cliente</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    
  </head>
  <body class="cmd-body" data-perfil="cliente">
    <header class="navbar cmd-topbar px-3">
      <span class="cmd-logo">Comanda</span>
      <div class="d-flex align-items-center gap-3">
        <span class="cmd-texto-apoio"
          >Olá, <span class="js-nome-usuario">Cliente</span></span
        >
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary"
          id="btn-sair"
        >
          Sair
        </button>
      </div>
    </header>

    <main class="container cmd-conteudo py-4">
      <ul class="nav nav-pills mb-4 cmd-abas" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="tab-cardapio"
            data-bs-toggle="pill"
            data-bs-target="#aba-cardapio"
            type="button"
            role="tab"
            aria-controls="aba-cardapio"
            aria-selected="true"
          >
            Cardápio
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-chamar"
            data-bs-toggle="pill"
            data-bs-target="#aba-chamar"
            type="button"
            role="tab"
            aria-controls="aba-chamar"
            aria-selected="false"
          >
            Chamar garçom
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <section
          class="tab-pane fade show active"
          id="aba-cardapio"
          role="tabpanel"
          aria-labelledby="tab-cardapio"
        >
          <h1 class="cmd-titulo-pagina">Cardápio</h1>

          <div
            id="filtro-categorias"
            class="d-flex flex-wrap gap-2 my-3"
            role="group"
            aria-label="Filtrar por categoria"
          ></div>

          <div id="lista-cardapio" class="row g-3"></div>
          <p id="cardapio-vazio" class="cmd-texto-apoio d-none">
            Nenhum item disponível nesta categoria.
          </p>
        </section>

        <section
          class="tab-pane fade"
          id="aba-chamar"
          role="tabpanel"
          aria-labelledby="tab-chamar"
        >
          <div class="row g-4">
            <div class="col-12 col-md-6">
              <h1 class="cmd-titulo-pagina">Chamar garçom</h1>
              <p class="cmd-texto-apoio">
                Informe a sua mesa. Os atendentes e o administrador recebem o
                aviso na hora.
              </p>

              <form id="form-chamado" novalidate>
                <div class="mb-3">
                  <label for="chamado-mesa" class="form-label"
                    >Número da mesa</label
                  >
                  <input
                    type="number"
                    class="form-control form-control-lg cmd-input-mesa"
                    id="chamado-mesa"
                    min="1"
                    placeholder="7"
                    required
                  />
                </div>

                <fieldset class="mb-3">
                  <legend class="form-label fs-6">Motivo (opcional)</legend>
                  <div class="d-flex flex-wrap gap-2">
                    <input
                      type="radio"
                      class="btn-check"
                      name="motivo"
                      id="motivo-conta"
                      value="Conta"
                      autocomplete="off"
                      checked
                    />
                    <label
                      class="btn btn-outline-dark rounded-pill"
                      for="motivo-conta"
                      >Conta</label
                    >

                    <input
                      type="radio"
                      class="btn-check"
                      name="motivo"
                      id="motivo-duvida"
                      value="Dúvida"
                      autocomplete="off"
                    />
                    <label
                      class="btn btn-outline-dark rounded-pill"
                      for="motivo-duvida"
                      >Dúvida</label
                    >

                    <input
                      type="radio"
                      class="btn-check"
                      name="motivo"
                      id="motivo-agua"
                      value="Água"
                      autocomplete="off"
                    />
                    <label
                      class="btn btn-outline-dark rounded-pill"
                      for="motivo-agua"
                      >Água</label
                    >

                    <input
                      type="radio"
                      class="btn-check"
                      name="motivo"
                      id="motivo-outro"
                      value="Outro"
                      autocomplete="off"
                    />
                    <label
                      class="btn btn-outline-dark rounded-pill"
                      for="motivo-outro"
                      >Outro</label
                    >
                  </div>
                </fieldset>

                <div
                  id="chamado-erro"
                  class="alert alert-danger d-none"
                  role="alert"
                ></div>
                <button
                  type="submit"
                  class="btn btn-lg w-100 cmd-btn-principal"
                  id="btn-chamar-garcom"
                >
                  Chamar garçom
                </button>
              </form>
            </div>

            <div class="col-12 col-md-6">
              <div class="card cmd-card" id="card-ultimo-chamado">
                <div class="card-body">
                  <div
                    class="d-flex justify-content-between align-items-center mb-2"
                  >
                    <h2 class="h6 mb-0">Seu último chamado</h2>
                    <span
                      class="badge cmd-status js-status-chamado"
                      id="status-chamado"
                      >Nenhum</span
                    >
                  </div>
                  <p
                    class="cmd-texto-apoio mb-3 js-resumo-chamado"
                    id="resumo-chamado"
                  >
                    Você ainda não fez nenhum chamado.
                  </p>

                  <ol class="cmd-passos list-unstyled d-flex gap-2 mb-0">
                    <li
                      class="cmd-passo flex-fill js-passo"
                      data-passo="aberto"
                    >
                      Enviado
                    </li>
                    <li
                      class="cmd-passo flex-fill js-passo"
                      data-passo="em_atendimento"
                    >
                      Em atendimento
                    </li>
                    <li
                      class="cmd-passo flex-fill js-passo"
                      data-passo="atendido"
                    >
                      Atendido
                    </li>
                  </ol>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <template id="tpl-item-cardapio">
      <div class="col-12 col-md-6 col-lg-4">
        <article class="card cmd-card h-100 cmd-item">
          <div class="card-body d-flex gap-3">
            <img class="cmd-item-foto js-foto" src="" alt="" />
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between gap-2">
                <h2 class="h6 mb-1 js-nome"></h2>
                <span class="cmd-preco js-preco"></span>
              </div>
              <p class="cmd-texto-apoio small mb-1 js-descricao"></p>
              <span class="badge cmd-categoria js-categoria"></span>
            </div>
          </div>
        </article>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cliente.js"></script>
  </body>
</html>
